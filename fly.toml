app = 'philreviews'
primary_region = 'lax'

[build]

[env]
  DB_PATH = '/data/reviews.db'

[mounts]
  source = 'philreviews_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      interval = "30s"
      timeout = "5s"
      grace_period = "10s"
      method = "GET"
      path = "/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
